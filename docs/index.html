<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N64 sincos kernel</title>
<!-- This page shows README.md from the repository, so the two cannot differ. -->
<style>
:root { --bg: #ffffff; --fg: #1d1d1f; --muted: #5f6368; --line: #dddddd; --code: #f5f5f7; --note: #0969da; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #161618; --fg: #e8e8ea; --muted: #a0a3a8; --line: #333336; --code: #1f1f22; --note: #4493f8; }
}
:root[data-theme="dark"] { --bg: #161618; --fg: #e8e8ea; --muted: #a0a3a8; --line: #333336; --code: #1f1f22; --note: #4493f8; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
a { color: var(--note); }
h1 { font-size: 24px; } h2 { font-size: 19px; margin-top: 32px; border-bottom: 1px solid var(--line); padding-bottom: 4px; } h3 { font-size: 16px; }
code, pre { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--code); border-radius: 4px; }
code { padding: 1px 4px; } pre { padding: 10px 12px; overflow-x: auto; } pre code { padding: 0; }
blockquote { margin: 0 0 16px; padding: 4px 14px; border-left: 4px solid var(--note); color: var(--fg); }
.scroll { overflow-x: auto; margin: 0 0 16px; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 4px 10px; border: 1px solid var(--line); vertical-align: top; }
th { background: var(--code); text-align: left; }
#status { color: var(--muted); }
</style>
</head>
<body>
<main>
<p id="status">Loading README.md from <a href="https://github.com/msmfai/N64-trig">github.com/msmfai/N64-trig</a>…</p>
<div id="doc"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(async function () {
  const REPO = 'https://github.com/msmfai/N64-trig/blob/main/';
  const status = document.getElementById('status');
  try {
    const r = await fetch('https://raw.githubusercontent.com/msmfai/N64-trig/main/README.md');
    if (!r.ok) throw new Error(r.status);
    let md = await r.text();
    md = md.replace(/^> \[!NOTE\]\s*$/m, '> **Note**');
    const doc = document.getElementById('doc');
    doc.innerHTML = marked.parse(md, { gfm: true });
    const slug = t => t.trim().toLowerCase().replace(/[^\w\- ]+/g, '').replace(/ /g, '-');
    doc.querySelectorAll('h1, h2, h3').forEach(h => { h.id = slug(h.textContent); });
    doc.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if (!/^([a-z]+:|#)/i.test(href)) a.setAttribute('href', REPO + href);
    });
    doc.querySelectorAll('table').forEach(t => {
      const w = document.createElement('div'); w.className = 'scroll';
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    });
    status.remove();
    if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
  } catch (e) {
    status.innerHTML = 'Could not load the README. Read it on <a href="https://github.com/msmfai/N64-trig">GitHub</a>.';
  }
})();
</script>
</body>
</html>
